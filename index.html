<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ワカナディア：bird from green</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-wrapper">
    <!-- 開発用UI -->
    <div id="dev-tools">
        <span>🔧 <b>[読込]</b> 画像や音楽のテスト差し替え</span><br>
        🖼 画像: <input type="file" id="local-img-upload" accept="image/*" multiple><br>
        🎵 音楽: <input type="file" id="local-audio-upload" accept="audio/*, .mp3, .wav, .m4a, .aac, .ogg" multiple><br>
        <hr style="border-color:#555; margin: 5px 0;">
        <span>🚀 <b>[シーンジャンプ]</b></span><br>
        <select id="dev-scene-select">
            <option value="tap_to_start">タイトル画面</option>
            <option value="start">ACT 1: 本編開始</option>
            <option value="goto_clocktower">ACT 1: 時計塔</option>
            <option value="confrontation">ACT 1: 犯人対峙</option>
            <option value="act1_end_title">ACT 1: END</option>
            <option value="intermission_title">OPムービー</option>
            <option value="act2_title">ACT 2: 依頼</option>
            <option value="act2_start">ACT 2: 放課後</option>
            <option value="goto_shiori_house">ACT 2: 栞の家</option>
            <option value="act2_office_message">ACT 2: 留守電</option>
            <option value="review2_q1">ACT 2: 夜の整理</option>
            <option value="act2_end_title">ACT 2: END</option>
            <option value="act3_title">ACT 3: 留守番</option>
            <option value="act3_school">ACT 3: 学校</option>
            <option value="act3_client_house_ext">ACT 3: 林の家(外観)</option>
            <option value="act3_client_house_in">ACT 3: 林の家(応接室)</option>
            <option value="act3_alone">ACT 3: 一人の留守番</option>
            <option value="act3_garden">ACT 3: 庭の捜索</option>
            <option value="act3_back_to_room">ACT 3: ほむらの理由</option>
            <option value="act3_noise_2f">ACT 3: 2階の物音</option>
            <option value="act3_room2f_dark">ACT 3: 2階の探索</option>
            <option value="act3_light_search_commands">ACT 3: 明かり点灯後</option>
            <option value="act3_notice_anomaly">ACT 3: 本棚の違案感</option>
            <option value="act3_homura_action">ACT 3: 暗号メモ発見</option>
            <option value="act3_check_dummy_left">ACT 3: 花の模型発見</option>
        </select>
        <button onclick="jumpToScene()">ジャンプ</button>
        <hr style="border-color:#555; margin: 5px 0;">
        <button onclick="document.getElementById('dev-tools').style.display='none'" style="width:100%; margin-top:5px;">閉じる</button>
    </div>
    
    <canvas id="game-canvas" width="720" height="1280"></canvas>
</div>

<!-- 読み込み順は元のコードの並び順です。入れ替えないでください -->
    <script src="config.js"></script>
    <script src="assets.js"></script>
    <script src="audio.js"></script>
    <script src="core.js"></script>
    <script src="scenario.js"></script>
    <script src="engine.js"></script>
    <script src="input.js"></script>
    <script src="devtools.js"></script>

</body>
</html>
