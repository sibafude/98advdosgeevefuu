<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聖蘭学園：鏡の中の真実</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh; /* アドレスバー対応：画面の上下が隠れないようにする */
        width: 100vw;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        font-family: sans-serif;
    }

    #game-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 600px;
        background-color: #000;
        box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    #game-canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
    }

    /* 開発用：ローカルファイル読み込みUI（最初から表示） */
    #dev-tools {
        display: none; 
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 10px 15px;
        box-sizing: border-box;
        font-size: 14px;
        z-index: 100;
        border-bottom: 2px solid #555;
    }
    #dev-tools input {
        color: #fff;
        font-size: 14px;
        margin-top: 6px;
        margin-bottom: 12px;
    }
    #dev-tools button {
        background-color: #444;
        color: #fff;
        border: 1px solid #fff;
        padding: 5px 10px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="game-wrapper">
    <!-- 開発用UI -->
    <div id="dev-tools">
        <span>🔧 <b>[読込]</b> 画像や音楽のテスト差し替え（assetsフォルダ優先）</span><br>
        🖼 画像: <input type="file" id="local-img-upload" accept="image/*" multiple><br>
        🎵 音楽: <input type="file" id="local-audio-upload" accept="audio/*, .mp3, .wav, .m4a, .aac, .ogg" multiple><br>
        <button onclick="document.getElementById('dev-tools').style.display='none'">閉じる</button>
    </div>
    
    <canvas id="game-canvas" width="720" height="1280"></canvas>
</div>

<script>
    /* =========================================
       ゲームシステム初期設定
       ========================================= */
    const GAME_VERSION = "Ver 1.0.2"; // ゲームバージョンを更新

    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = 720;
    const HEIGHT = 1280;
    
    const LAYOUT = {
        window: { x: 0, y: 1000, w: 720, h: 280 },
        sysBtn: { x: 720 - 180, y: 1280 - 65, w: 140, h: 45 },
        logBtn: { x: 720 - 180 - 120, y: 1280 - 65, w: 100, h: 45 } 
    };

    // --- アセット管理 ---
    const imageCache = {};
    const fallbackImages = {
        "bg_gate": "https://placehold.co/720x1280/1a1a2e/FFF?text=Background:\\nSchool+Gate+(Sunset)",
        "bg_gate_morning": "https://placehold.co/720x1280/87ceeb/000?text=Background:\\nSchool+Gate+(Morning)", 
        "bg_office": "https://placehold.co/720x1280/3e2723/FFF?text=Background:\\nPrincipal+Office",
        "bg_office_morning": "https://placehold.co/720x1280/8b7d6b/FFF?text=Background:\\nPrincipal+Office+(Morning)", 
        "bg_library": "https://placehold.co/720x1280/2e2b20/FFF?text=Background:\\nLibrary",
        "bg_clocktower": "https://placehold.co/720x1280/1c2331/FFF?text=Background:\\nClock+Tower",
        "bg_classroom": "https://placehold.co/720x1280/5d4037/FFF?text=Background:\\nClassroom", 
        "bg_warehouse": "https://placehold.co/720x1280/2c3e50/FFF?text=Background:\\nWarehouse+Office",
        "bg_warehouse_night": "https://placehold.co/720x1280/1a1a2e/FFF?text=Background:\\nWarehouse+(Night)",
        "bg_bar": "https://placehold.co/720x1280/1a1010/FFF?text=Background:\\nNight+Bar", 
        "bg_shiori_house": "https://placehold.co/720x1280/4a3b32/FFF?text=Background:\\nShiori's+House", 
        "ev_kidnap": "https://placehold.co/720x1280/0d1117/FFF?text=Event+CG:\\nKidnapping+(720x1280)",
        "ev_rescue": "https://placehold.co/720x1280/2d0815/FFF?text=Event+CG:\\nRescue+Homura+and+Shiori",
        "ev_medal": "https://placehold.co/720x1280/111/FFF?text=Event+CG:\\nMedal+Photo", 
        "ch_homura": "https://placehold.co/400x800/e88/FFF?text=Character:\\nHomura+(400x800)",
        "ch_yui": "https://placehold.co/400x800/85a/FFF?text=Character:\\nYui+Tachibana",
        "ch_kenta": "https://placehold.co/400x800/585/FFF?text=Character:\\nKenta+Morishita",
        "ch_principal": "https://placehold.co/400x800/444/FFF?text=Character:\\nPrincipal+(Elder+Woman)", 
        "ch_shiori": "https://placehold.co/400x800/4a8/FFF?text=Character:\\nShiori",
        "ch_informant": "https://placehold.co/400x800/345/FFF?text=Character:\\nInformant",
        "ch_father": "https://placehold.co/400x800/333/FFF?text=Character:\\nFather+(Diplomat)", 
        "ui_panel": "https://placehold.co/720x280/000028/FFF?text=UI+Panel"
    };

    function loadInitialImages() {
        for (let key in fallbackImages) {
            const img = new Image();
            img.src = `assets/images/${key}.png`;
            img.onload = () => { imageCache[key] = img; };
            img.onerror = () => {
                const fbImg = new Image();
                fbImg.src = fallbackImages[key];
                fbImg.onload = () => { imageCache[key] = fbImg; };
            };
        }
    }
    loadInitialImages();

    // --- BGM・効果音管理 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isBgmPlaying = false;
    let defaultBgmInterval = null;
    let currentNote = 0;

    // 複数BGM対応 (mp3がない場合はm4aを試す)
    const bgmKeys = ["bgm", "bgm_tension", "bgm_night", "jingle"];
    const bgmAudios = {};

    bgmKeys.forEach(key => {
        const audio = new Audio();
        audio.src = `assets/audio/${key}.mp3`;
        audio.loop = !key.startsWith("jingle"); // ジングルはループしない
        audio.volume = 0.5;
        let m4aTried = false;
        audio.onerror = () => {
            if (!m4aTried) {
                m4aTried = true;
                audio.src = `assets/audio/${key}.m4a`;
            }
        };
        bgmAudios[key] = audio;
    });

    let currentBgmKey = 'bgm';
    let customBgmAudio = bgmAudios['bgm'];

    document.getElementById('local-img-upload').addEventListener('change', (e) => {
        const files = e.target.files;
        for(let file of files) {
            let id = file.name.toLowerCase();
            const dotIndex = id.lastIndexOf('.');
            if (dotIndex > 0) id = id.substring(0, dotIndex);

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => { imageCache[id] = img; };
                img.src = event.target.result; 
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('local-audio-upload').addEventListener('change', (e) => {
        const files = e.target.files;
        if (!files.length) return;
        stopBGM();
        
        for(let file of files) {
            let id = file.name.toLowerCase();
            const dotIndex = id.lastIndexOf('.');
            if (dotIndex > 0) id = id.substring(0, dotIndex);

            const reader = new FileReader();
            reader.onload = (event) => {
                const newAudio = new Audio(event.target.result);
                newAudio.loop = !id.startsWith("jingle");
                newAudio.volume = 0.5;
                bgmAudios[id] = newAudio; 
                
                if (currentBgmKey === id || (currentBgmKey === 'bgm' && id === 'bgm')) {
                    customBgmAudio = newAudio;
                    if (state.bgmEnabled && hasInteracted) {
                        customBgmAudio.currentTime = 0;
                        customBgmAudio.play().catch(err => console.log("再生待機"));
                    }
                }
            };
            reader.readAsDataURL(file);
        }
    });

    function startBGM() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!state.bgmEnabled) return;

        if (customBgmAudio && currentBgmKey !== "stop") {
            if (customBgmAudio.paused) customBgmAudio.play().catch(e => console.error(e));
            isBgmPlaying = true;
        } else if (!isBgmPlaying && currentBgmKey !== "stop") {
            isBgmPlaying = true;
            playDefaultBGM();
        }
    }

    function stopBGM() {
        isBgmPlaying = false;
        if (customBgmAudio) {
            customBgmAudio.pause();
            customBgmAudio.currentTime = 0;
        }
        if (defaultBgmInterval) {
            clearInterval(defaultBgmInterval);
            defaultBgmInterval = null;
        }
    }

    function playDefaultBGM() {
        if (!audioCtx) return;
        const notesNormal = [220, 261.63, 329.63, 261.63, 220, 164.81]; 
        const notesTension = [110, 116.54, 123.47]; 
        
        defaultBgmInterval = setInterval(() => {
            if (!isBgmPlaying || customBgmAudio.readyState >= 2) return; 
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = currentBgmKey === 'bgm_tension' ? 'sawtooth' : 'triangle';
            const notes = currentBgmKey === 'bgm_tension' ? notesTension : notesNormal;
            
            osc.frequency.value = notes[currentNote % notes.length];
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
            currentNote++;
        }, currentBgmKey === 'bgm_tension' ? 200 : 300);
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'select') {
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'cancel') {
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    // --- タイトル演出ステータス ---
    let titleState = {
        active: false,
        phase: 0, // 0: fadeIn, 1: wait, 2: fadeOut
        alpha: 0,
        timer: 0,
        text1: "",
        text2: "",
        nextScene: "",
        jingle: ""
    };

    function showTitle(t1, t2, next, jingleKey) {
        titleState.active = true;
        titleState.phase = 0;
        titleState.alpha = 0;
        titleState.timer = 0;
        titleState.text1 = t1;
        titleState.text2 = t2;
        titleState.nextScene = next;
        titleState.jingle = jingleKey;

        if (customBgmAudio) customBgmAudio.pause(); // BGM一時停止
        
        if (jingleKey && bgmAudios[jingleKey] && state.bgmEnabled && hasInteracted) {
            bgmAudios[jingleKey].currentTime = 0;
            bgmAudios[jingleKey].volume = 0.5; // 初期音量
            bgmAudios[jingleKey].play().catch(e=>{});
        }
    }

    // --- ゲームステータス ---
    let state = {
        sceneId: "tap_to_start",
        previousSceneId: "tap_to_start",
        textPages: [],
        currentPage: 0,
        displayedText: "",
        fullText: "",
        textIndex: 0,
        isTyping: false,
        uiVisible: true,
        showCommands: false, 
        sysBtnActive: false,
        logBtnActive: false, 
        buttons: [],

        lastLineEndX: 0, 
        lastLineEndY: 0,
        flags: {}, 
        gameOverCount: 0, 
        pendingLoadSceneId: null,
        bgmEnabled: true,
        log: [], 
        showLog: false, 
        logScrollY: 0,

        forceLogScrollBottom: false

    let stateBackup = null; 

    let lastFrameTime = Date.now();
    let textTimer = 0;
    const TEXT_SPEED = 30;

       シナリオデータ
       ========================================= */
    const scenario = {

        },

        },

        "start": {

            text: [

                "冴島「なるほど。それが噂の『時計塔の悪魔』ってやつか。」",

                "冴島（やれやれ、この図書委員のお嬢ちゃんは随分と熱心だ。俺が探偵だってことは、当然バレてないがな。）"
            ],
            onLoad: () => { 
                state.flags = {}; 
                state.flags.visitedLibrary = true;
            },
            nextScene: "intro_flashback"
        },
        "intro_flashback": {
            bgId: "bg_office_morning", 
            charId: "ch_principal",
            text: [
                "冴島（事の始まりは今朝のことだ……。）",

                "学園長「お待ちしておりました。探偵の冴島さんですね。」",
                "冴島（上品で温厚そうな学園長から直々に依頼されたのは、まさにその『時計塔の悪魔』と古書盗難事件の調査だった。）",

        },

    /* =========================================
       ゲームロジック＆描画
       ========================================= */

    function calculateMaxLogScroll() {
        const padX = 30;
        const maxWidth = WIDTH - padX * 2;
        const lineHeight = 36;
        let contentHeight = 0;
        for (let i = 0; i < state.log.length; i++) {
            const text = state.log[i];
            const lines = text.split('\n');
            for (let j = 0; j < lines.length; j++) {
                let line = "";
                const words = lines[j].split('');
                for (let k = 0; k < words.length; k++) {
                    const testLine = line + words[k];
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && k > 0) {
                        line = words[k];
                        contentHeight += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                contentHeight += lineHeight;
            }
            contentHeight += lineHeight / 2; // ログ間の余白
        }
        return Math.min(0, HEIGHT - contentHeight - 100);
    }

    function loadScene(sceneId) {
        if(!scenario[sceneId]) return;
        state.sceneId = sceneId;
        const scene = scenario[sceneId];
        
        // BGMの切り替え処理
        if (scene.bgm !== undefined) {
            if (scene.bgm === "stop") {
                if (customBgmAudio) customBgmAudio.pause();
                currentBgmKey = "stop";
            } else if (currentBgmKey !== scene.bgm) {
                if (customBgmAudio) customBgmAudio.pause();
                currentBgmKey = scene.bgm;
                customBgmAudio = bgmAudios[currentBgmKey];
                if (customBgmAudio) customBgmAudio.currentTime = 0; // 毎回最初から再生
                if (state.bgmEnabled && hasInteracted && customBgmAudio) {
                    customBgmAudio.play().catch(e=>{});
                }
            }
        }

        const expectedSceneId = sceneId;
        if (scene.onLoad) scene.onLoad();
        
        if (state.sceneId !== expectedSceneId) return; 

        state.textPages = scene.text || [];
        
        if (state.textPages.length === 0 || (state.textPages.length === 1 && state.textPages[0] === "")) {
            state.showCommands = true;
            state.displayedText = "";
            state.fullText = "";
            state.isTyping = false;
        } else {
            state.showCommands = false;
            state.currentPage = 0;
            state.fullText = state.textPages[0];
            state.displayedText = "";
            state.textIndex = 0;
            state.isTyping = true;
        }

        // ログの記録
        if (state.textPages.length > 0 && state.textPages[0] !== "") {
            if (state.log.length === 0 || state.log[state.log.length - 1] !== state.textPages[0]) {
                state.log.push(state.textPages[0]);
            }
        }
        
        textTimer = 0;
        calculateButtons(scene.commands);
    }

    function openSystemMenu() {
        state.previousSceneId = state.sceneId;
        stateBackup = {
            sceneId: state.sceneId,
            textPages: state.textPages,
            currentPage: state.currentPage,
            displayedText: state.displayedText,
            fullText: state.fullText,
            textIndex: state.textIndex,
            isTyping: state.isTyping,
            showCommands: state.showCommands,
            buttons: state.buttons,
            lastLineEndX: state.lastLineEndX,
            lastLineEndY: state.lastLineEndY
        };
        loadScene("system_menu");
    }

    function closeSystemMenu() {
        if (stateBackup) {
            state.sceneId = stateBackup.sceneId;
            state.textPages = stateBackup.textPages;
            state.currentPage = stateBackup.currentPage;
            state.displayedText = stateBackup.displayedText;
            state.fullText = stateBackup.fullText;
            state.textIndex = stateBackup.textIndex;
            state.isTyping = stateBackup.isTyping;
            state.showCommands = stateBackup.showCommands;
            state.buttons = stateBackup.buttons;
            state.lastLineEndX = stateBackup.lastLineEndX;
            state.lastLineEndY = stateBackup.lastLineEndY;
            stateBackup = null;
        } else {
            loadScene(state.previousSceneId);
        }
    }

    function calculateButtons(commands) {
        state.buttons = [];
        if(!commands || commands.length === 0) return;
        
        const validCommands = commands.filter(cmd => !cmd.condition || cmd.condition());
        if(validCommands.length === 0) return;
        
        const cols = validCommands.length > 4 ? 3 : (validCommands.length > 1 ? 2 : 1);
        const rows = Math.ceil(validCommands.length / cols); 
        
        const padX = 120; 
        const gapX = 15;
        const gapY = 25; 
        
        const win = LAYOUT.window;
        
        const btnW = (win.w - (padX * 2) - (gapX * (cols - 1))) / cols;
        const btnH = 50; 
        
        const startX = win.x + padX;
        const totalH = (btnH * rows) + (gapY * (rows - 1));
        const startY = win.y + (win.h - totalH) / 2;

        validCommands.forEach((cmd, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const btnLabel = typeof cmd.label === 'function' ? cmd.label() : cmd.label;
            
            state.buttons.push({
                x: startX + col * (btnW + gapX),
                y: startY + row * (btnH + gapY),
                w: btnW,
                h: btnH,
                label: btnLabel,
                target: cmd.target,
                action: cmd.action
            });
        });
    }

    function drawBackground(img, targetX, targetY, targetW, targetH) {
        const imgRatio = img.width / img.height;
        const targetRatio = targetW / targetH;
        let sWidth = img.width;
        let sHeight = img.height;
        let sX = 0;
        let sY = 0;

        if (imgRatio > targetRatio) {
            sWidth = img.height * targetRatio;
            sX = (img.width - sWidth) / 2;
        } else {
            sHeight = img.width / targetRatio;
            sY = (img.height - sHeight) / 2;
        }
        ctx.drawImage(img, sX, sY, sWidth, sHeight, targetX, targetY, targetW, targetH);
    }

    function drawCharacter(img) {
        let scale = 1.45; 
        let drawW = img.width * scale;
        let drawH = img.height * scale;
        
        if (drawW > WIDTH * 1.1) {
            scale = (WIDTH * 1.1) / img.width;
            drawW = img.width * scale;
            drawH = img.height * scale;
        }
        
        const drawX = 0; 
        const drawY = HEIGHT - drawH; 
        
        ctx.drawImage(img, 0, 0, img.width, img.height, drawX, drawY, drawW, drawH);
    }

    function drawTextAndGetEndPosition(text, x, y, maxWidth, lineHeight) {
        const lines = text.split('\n');
        let currentY = y;
        let lastLineText = "";

        for (let i = 0; i < lines.length; i++) {
            let line = "";
            const words = lines[i].split('');
            for (let j = 0; j < words.length; j++) {
                const testLine = line + words[j];
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && j > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[j];
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            lastLineText = line;
            if (i < lines.length - 1) {
                currentY += lineHeight;
            }
        }
        
        const lastLineMetrics = ctx.measureText(lastLineText);
        state.lastLineEndX = x + lastLineMetrics.width;
        state.lastLineEndY = currentY;
    }

    function draw() {
        // TAP TO START 画面の描画
        if (state.sceneId === "tap_to_start") {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = (Date.now() % 1000 < 500) ? "#fff" : "transparent";
            ctx.font = "bold 30px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("TAP TO START", WIDTH / 2, HEIGHT / 2);
            ctx.textBaseline = "alphabetic";
            return;
        }

        // タイトルフェード演出中の描画処理
        if (titleState.active) {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            ctx.fillStyle = `rgba(255, 255, 255, ${titleState.alpha})`;
            ctx.font = "bold 50px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(titleState.text1, WIDTH / 2, HEIGHT / 2 - 40);
            ctx.font = "bold 60px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
            ctx.fillText(titleState.text2, WIDTH / 2, HEIGHT / 2 + 50);
            ctx.textBaseline = "alphabetic";
            return; 
        }

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        let visualSceneId = state.sceneId;
        if (state.sceneId.startsWith("sys_") || state.sceneId === "system_menu") {
            visualSceneId = state.previousSceneId;
        }

        const visualScene = scenario[visualSceneId];
        const parentScene = scenario["start"]; 
        const bgId = visualScene.bgId || parentScene.bgId;

        // 1. 背景描画
        if (bgId && imageCache[bgId] && imageCache[bgId].complete) {
            drawBackground(imageCache[bgId], 0, 0, WIDTH, HEIGHT);
        } else {
            ctx.fillStyle = "#1a1a2e";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        // 2. キャラクター描画
        const isEventScene = (bgId === "ev_rescue" || bgId === "ev_kidnap" || bgId === "ev_medal");
        if (!isEventScene && visualScene.charId && imageCache[visualScene.charId] && imageCache[visualScene.charId].complete) {
            drawCharacter(imageCache[visualScene.charId]);
        }

        // 3. UI表示
        if (state.uiVisible) {
            const uiImg = imageCache["ui_panel"];
            const win = LAYOUT.window;
            
            if (uiImg && uiImg.complete) {
                ctx.drawImage(uiImg, win.x, win.y, win.w, win.h);
            } else {
                ctx.fillStyle = "rgba(0, 0, 40, 0.9)";
                ctx.fillRect(win.x, win.y, win.w, win.h);
                ctx.strokeStyle = "rgba(220, 220, 220, 0.8)";
                ctx.lineWidth = 4;
                ctx.strokeRect(win.x, win.y, win.w, win.h);
            }

            // バージョン情報の表示（システムメニュー時、UIパネル内に収める）
            if (state.sceneId === "system_menu" || state.sceneId.startsWith("sys_")) {
                ctx.fillStyle = "#888";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillText(GAME_VERSION, win.x + win.w - 15, win.y + 25);
                ctx.textBaseline = "alphabetic"; 
            }

            // システムボタン描画
            const sysBtn = LAYOUT.sysBtn;
            ctx.fillStyle = state.sysBtnActive ? "#ffeb3b" : "#ccc";
            ctx.font = "bold 22px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "#000";
            ctx.shadowBlur = 4;
            ctx.fillText("システム", sysBtn.x + sysBtn.w / 2, sysBtn.y + sysBtn.h / 2);
            ctx.shadowBlur = 0;
            ctx.textBaseline = "alphabetic";

            // ログボタン描画
            const logBtn = LAYOUT.logBtn;
            ctx.fillStyle = state.logBtnActive ? "#ffeb3b" : "#ccc";
            ctx.font = "bold 22px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "#000";
            ctx.shadowBlur = 4;
            ctx.fillText("ログ", logBtn.x + logBtn.w / 2, logBtn.y + logBtn.h / 2);
            ctx.shadowBlur = 0;
            ctx.textBaseline = "alphabetic";

            if (!state.showCommands) {
                ctx.fillStyle = "#fff";
                ctx.font = "26px 'ヒラギノ明朝 ProN', 'MS P明朝', serif"; 
                
                if (state.sceneId === "game_over") {
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#000";
                    ctx.shadowBlur = 4;
                    ctx.fillText(state.displayedText, win.x + win.w / 2, win.y + win.h / 2);
                    ctx.shadowBlur = 0;
                    if (!state.isTyping) {
                        ctx.fillStyle = (Date.now() % 1000 < 500) ? "#fff" : "transparent";
                        ctx.fillText("▼", win.x + win.w / 2, win.y + win.h / 2 + 40);
                    }
                    ctx.textBaseline = "alphabetic";
                } else {
                    ctx.textAlign = "left";
                    ctx.shadowColor = "#000";
                    ctx.shadowBlur = 4;

                    const textPadX = 40; 
                    const textPadY = 55; 
                    const lineHeight = 42; 
                    
                    drawTextAndGetEndPosition(state.displayedText, win.x + textPadX, win.y + textPadY, win.w - (textPadX * 2), lineHeight);
                    ctx.shadowBlur = 0;

                    if (!state.isTyping) {
                        ctx.fillStyle = (Date.now() % 1000 < 500) ? "#fff" : "transparent";
                        ctx.font = "26px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
                        ctx.fillText("▼", state.lastLineEndX + 5, state.lastLineEndY);
                    }
                }
            } else {
                state.buttons.forEach((btn, idx) => {
                    const isPressed = (state.activeButtonIndex === idx);
                    
                    ctx.fillStyle = isPressed ? "#ffeb3b" : "#fff"; 
                    ctx.font = "26px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.shadowColor = "#000";
                    ctx.shadowBlur = 4;
                    
                    ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
                    
                    ctx.shadowBlur = 0;
                    ctx.textBaseline = "alphabetic";
                });
            }
        }

        // 4. ログ画面の描画（透過して上に重ねる）
        if (state.showLog) {
            // スクロールのクランプ
            if (state.logScrollY < state.maxLogScroll) state.logScrollY = state.maxLogScroll;
            if (state.logScrollY > 0) state.logScrollY = 0;

            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.fillStyle = "#fff";
            ctx.font = "24px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            const padX = 30;
            const maxWidth = WIDTH - padX * 2;
            const lineHeight = 36;

            // 実際のログテキストの描画
            let currentY = 50 + state.logScrollY;
            for (let i = 0; i < state.log.length; i++) {
                const text = state.log[i];
                if (!text) continue;
                const lines = text.split('\n');
                for (let j = 0; j < lines.length; j++) {
                    let line = "";
                    const words = lines[j].split('');
                    for (let k = 0; k < words.length; k++) {
                        const testLine = line + words[k];
                        const metrics = ctx.measureText(testLine);
                        if (metrics.width > maxWidth && k > 0) {
                            if (currentY > -lineHeight && currentY < HEIGHT) {
                                ctx.fillText(line, padX, currentY);
                            }
                            line = words[k];
                            currentY += lineHeight;
                        } else {
                            line = testLine;
                        }
                    }
                    if (currentY > -lineHeight && currentY < HEIGHT) {
                        ctx.fillText(line, padX, currentY);
                    }
                    currentY += lineHeight;
                }
                currentY += lineHeight / 2;
            }
        }
    }

    function update() {
        const now = Date.now();
        const dt = now - lastFrameTime;
        lastFrameTime = now;

        // タイトルフェード演出中のロジック
        if (titleState.active) {
            titleState.timer += dt;
            
            let jingleEnded = false;
            if (titleState.jingle && bgmAudios[titleState.jingle]) {
                const jingleAudio = bgmAudios[titleState.jingle];
                if (jingleAudio.ended) {
                    jingleEnded = true;
                }
            }

            if (titleState.phase === 0) { // Fade In & Wait
                titleState.alpha += dt / 1000;
                if (titleState.alpha >= 1) {
                    titleState.alpha = 1;
                    titleState.phase = 1;
                }
                if (titleState.timer >= 4000) { 
                    titleState.phase = 2;
                }
            } else if (titleState.phase === 1) { // Wait
                if (titleState.timer >= 4000) { 
                    titleState.phase = 2;
                }
            } else if (titleState.phase === 2) { // Fade Out
                titleState.alpha = 1 - ((titleState.timer - 4000) / 4000);
                
                if (titleState.jingle && bgmAudios[titleState.jingle]) {
                    const jingleAudio = bgmAudios[titleState.jingle];
                    if (!jingleAudio.paused) {
                        let newVolume = 0.5 * titleState.alpha; 
                        if (newVolume <= 0) {
                            newVolume = 0;
                            jingleAudio.pause();
                            jingleAudio.currentTime = 0;
                        } else {
                            jingleAudio.volume = newVolume;
                        }
                    }
                }

                if (titleState.timer >= 8000 || titleState.alpha <= 0) {
                    titleState.alpha = 0;
                    titleState.active = false;
                    state.uiVisible = true;
                    if (titleState.jingle && bgmAudios[titleState.jingle]) {
                        bgmAudios[titleState.jingle].pause();
                        bgmAudios[titleState.jingle].currentTime = 0;
                        bgmAudios[titleState.jingle].volume = 0.5;
                    }
                    loadScene(titleState.nextScene);
                }
            }
            return;
        }

        // ログの慣性スクロール
        if (state.showLog) {
            if (!isDraggingLog) {
                if (Math.abs(logVelocityY) > 0.1) {
                    state.logScrollY += logVelocityY;
                    logVelocityY *= 0.95; 
                } else {
                    logVelocityY = 0;
                }

                if (state.logScrollY > 0) {
                    state.logScrollY += (0 - state.logScrollY) * 0.2;
                    if (state.logScrollY < 0.5) state.logScrollY = 0;
                } else if (state.maxLogScroll !== undefined && state.logScrollY < state.maxLogScroll) {
                    state.logScrollY += (state.maxLogScroll - state.logScrollY) * 0.2;
                    if (state.logScrollY > state.maxLogScroll - 0.5) state.logScrollY = state.maxLogScroll;
                }
            } else {
                if (state.logScrollY > 0) {
                    state.logScrollY -= (state.logScrollY) * 0.1;
                } else if (state.maxLogScroll !== undefined && state.logScrollY < state.maxLogScroll) {
                    state.logScrollY += (state.maxLogScroll - state.logScrollY) * 0.1;
                }
            }
        }

        if (state.isTyping && !state.showCommands && !state.showLog) {
            textTimer += dt;
            if (textTimer >= TEXT_SPEED) {
                textTimer = 0;
                state.textIndex++;
                state.displayedText = state.fullText.substring(0, state.textIndex);
                if (state.textIndex >= state.fullText.length) {
                    state.isTyping = false;
                }
            }
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    /* =========================================
       入力処理
       ========================================= */
    let hasInteracted = false;
    let isDraggingLog = false;
    let logStartY = 0;
    let logStartScrollY = 0;
    let logLastY = 0;
    let logVelocityY = 0;
    let logDragDist = 0;

    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }

        const scaleX = rect.width / WIDTH;
        const scaleY = rect.height / HEIGHT;
        const scale = Math.min(scaleX, scaleY);
        
        const displayWidth = WIDTH * scale;
        const displayHeight = HEIGHT * scale;
        
        const offsetX = rect.left + (rect.width - displayWidth) / 2;
        const offsetY = rect.top + (rect.height - displayHeight) / 2;

        return {
            x: (clientX - offsetX) / scale,
            y: (clientY - offsetY) / scale
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (state.sceneId === "tap_to_start") {
            if (!hasInteracted) hasInteracted = true;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            state.sceneId = "dummy_start";
            showTitle("ACT 1", "予兆", "start", "jingle");
            return;
        }

        if (titleState.active) {
            if (titleState.timer < 4000) {
                titleState.timer = 4000;
            } else {
                titleState.timer = 8000;
            }
            return;
        }
        if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'button') return;

        if (!hasInteracted) {
            hasInteracted = true;
        }
        startBGM();

        const pos = getPointerPos(e);

        if (state.showLog) {
            isDraggingLog = true;
            logStartY = pos.y;
            logLastY = pos.y;
            logVelocityY = 0;
            logDragDist = 0;
            return;
        }

        if (state.uiVisible) {
            const sysBtn = LAYOUT.sysBtn;
            if (pos.x >= sysBtn.x && pos.x <= sysBtn.x + sysBtn.w && pos.y >= sysBtn.y && pos.y <= sysBtn.y + sysBtn.h) {
                state.sysBtnActive = true;
            }
            const logBtn = LAYOUT.logBtn;
            if (pos.x >= logBtn.x && pos.x <= logBtn.x + logBtn.w && pos.y >= logBtn.y && pos.y <= logBtn.y + logBtn.h) {
                state.logBtnActive = true;
            }
            if (state.showCommands) {
                for (let i = 0; i < state.buttons.length; i++) {
                    const btn = state.buttons[i];
                    if (pos.x >= btn.x && pos.x <= btn.x + btn.w && pos.y >= btn.y && pos.y <= btn.y + btn.h) {
                        state.activeButtonIndex = i;
                    }
                }
            }
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        if (state.showLog && isDraggingLog) {
            const pos = getPointerPos(e);
            const deltaY = pos.y - logLastY;
            logDragDist += Math.abs(deltaY);
            logVelocityY = deltaY;
            state.logScrollY += deltaY;
            logLastY = pos.y;
        }
    });

    canvas.addEventListener('pointerup', (e) => {
        if (titleState.active) return;
        const pos = getPointerPos(e);

        if (state.showLog) {
            isDraggingLog = false;
            if (logDragDist < 10) { 
                state.showLog = false;
                playSound('cancel');
            }
            return;
        }

        if (!state.uiVisible) {
            state.uiVisible = true;
            return;
        }

        state.sysBtnActive = false;
        state.logBtnActive = false;
        state.activeButtonIndex = -1;

        const sysBtn = LAYOUT.sysBtn;
        if (pos.x >= sysBtn.x && pos.x <= sysBtn.x + sysBtn.w && pos.y >= sysBtn.y && pos.y <= sysBtn.y + sysBtn.h) {
            playSound('select');
            if (state.sceneId === "system_menu" || state.sceneId.startsWith("sys_")) {
                if (state.pendingLoadSceneId) {
                    let id = state.pendingLoadSceneId;
                    state.pendingLoadSceneId = null;
                    stateBackup = null;
                    loadScene(id);
                } else {
                    closeSystemMenu();
                }
            } else {
                openSystemMenu();
            }
            return;
        }

        const logBtn = LAYOUT.logBtn;
        if (pos.x >= logBtn.x && pos.x <= logBtn.x + logBtn.w && pos.y >= logBtn.y && pos.y <= logBtn.y + logBtn.h) {
            playSound('select');
            state.showLog = true;
            state.forceLogScrollBottom = true; 
            ctx.font = "24px 'ヒラギノ明朝 ProN', 'MS P明朝', serif";
            state.maxLogScroll = calculateMaxLogScroll();
            return;
        }

        if (state.showCommands) {
            for (let i = 0; i < state.buttons.length; i++) {
                const btn = state.buttons[i];
                if (pos.x >= btn.x && pos.x <= btn.x + btn.w && pos.y >= btn.y && pos.y <= btn.y + btn.h) {
                    if(btn.label === "戻る") playSound('cancel');
                    else playSound('select');

                    if (btn.target) {
                        loadScene(btn.target);
                    } 
                    else if (btn.action === "toggle_dev") {
                        const devTools = document.getElementById('dev-tools');
                        devTools.style.display = (devTools.style.display === "none" || devTools.style.display === "") ? "block" : "none";
                        closeSystemMenu(); 
                    }
                    else if (btn.action === "hide_ui") {
                        state.uiVisible = false;
                        closeSystemMenu(); 
                    }
                    else if (btn.action === "toggle_bgm") {
                        state.bgmEnabled = !state.bgmEnabled;
                        if (state.bgmEnabled) {
                            if (currentBgmKey !== "stop" && customBgmAudio) {
                                customBgmAudio.currentTime = 0; 
                                customBgmAudio.play().catch(e=>{});
                            }
                        } else {
                            if (customBgmAudio) customBgmAudio.pause();
                        }
                        calculateButtons(scenario[state.sceneId].commands);
                    }
                    else if (btn.action === "close_system") {
                        if (state.pendingLoadSceneId) {
                            let id = state.pendingLoadSceneId;
                            state.pendingLoadSceneId = null;
                            stateBackup = null;
                            loadScene(id);
                        } else {
                            closeSystemMenu(); 
                        }
                    }
                    else if (btn.action === "direct_load") {
                        const saved = localStorage.getItem("seiran_save_data");
                        if (saved && scenario[saved]) loadScene(saved);
                        else loadScene("start"); 
                    }
                    return;
                }
            }
            if (pos.y < LAYOUT.window.y) {
                state.uiVisible = false;
            }
        } else {
            if (state.isTyping) {
                state.displayedText = state.fullText;
                state.textIndex = state.fullText.length;
                state.isTyping = false;
            } 
            else if (state.currentPage < state.textPages.length - 1) {
                state.currentPage++;
                state.fullText = state.textPages[state.currentPage];
                if (state.log.length === 0 || state.log[state.log.length - 1] !== state.fullText) {
                    state.log.push(state.fullText);
                }
                state.displayedText = "";
                state.textIndex = 0;
                state.isTyping = true;
                playSound('select');
            }
            else if (state.buttons.length > 0) {
                state.showCommands = true;
                playSound('select');
            }
            else if (scenario[state.sceneId].nextScene) {
                loadScene(scenario[state.sceneId].nextScene);
                playSound('select');
            }
        }
    });

    canvas.addEventListener('pointerleave', () => {
        state.sysBtnActive = false;
        state.logBtnActive = false;
        state.activeButtonIndex = -1;
        isDraggingLog = false;
    });

    window.onload = () => {
        loadScene("tap_to_start"); 
        loop();
    };
</script>

</body>
